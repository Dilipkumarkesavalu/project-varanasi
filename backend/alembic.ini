# One Alembic history per module schema (ADR-0008 §5).
# Usage:  uv run alembic -n platform upgrade head
#         uv run alembic -n billing revision -m "create invoice"
# The database URL comes from VARANASI_DB_MIGRATOR_URL (see .env.example).

[DEFAULT]
prepend_sys_path = src
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
truncate_slug_length = 40

[platform]
script_location = varanasi.platform:migrations

[billing]
script_location = varanasi.billing:migrations

[hrms]
script_location = varanasi.hrms:migrations
