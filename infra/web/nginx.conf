server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API and health go to the backend container (same origin, so no CORS needed).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location = /health       { proxy_pass http://backend:8000; }
    location = /health/ready { proxy_pass http://backend:8000; }

    # Each Flutter app lives under its own path; unknown paths fall back to its index.html.
    location /platform/ { try_files $uri $uri/ /platform/index.html; }
    location /billing/  { try_files $uri $uri/ /billing/index.html; }
    location /hrms/     { try_files $uri $uri/ /hrms/index.html; }

    # index.html must never be cached so new deploys are picked up immediately.
    location ~ /index\.html$ {
        add_header Cache-Control "no-cache" always;
    }

    # Real files (JS, JSON, fonts, images) are served as-is; a missing one is a 404,
    # never the HTML fallback (which would break the app with confusing parse errors).
    location ~ ^/(platform|billing|hrms)/.+\.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    location = / { return 302 /platform/; }
}
